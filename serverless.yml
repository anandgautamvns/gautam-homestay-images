          method: get
          authorizer:
            name: cognitoAuthorizer

  adminAddPhoto:
    handler: src/handlers/gallery.addPhoto
    layers:
      - !Ref UtilitiesLambdaLayer
    events:
      - httpApi:
          path: /admin/gallery
          method: post
          authorizer:
            name: cognitoAuthorizer

  adminUpdatePhoto:
    handler: src/handlers/gallery.updatePhoto
    layers:
      - !Ref UtilitiesLambdaLayer
    events:
      - httpApi:
          path: /admin/gallery/{photoId}
          method: patch
          authorizer:
            name: cognitoAuthorizer

  adminDeletePhoto:
    handler: src/handlers/gallery.deletePhoto
