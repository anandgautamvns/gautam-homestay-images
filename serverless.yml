    AdminListReviewsLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:custom.stage}-adminListReviews
        RetentionInDays: 30

    AdminApproveReviewLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:custom.stage}-adminApproveReview
        RetentionInDays: 30

    AdminDeleteReviewLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:custom.stage}-adminDeleteReview
        RetentionInDays: 30

    ListAmenitiesLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:custom.stage}-listAmenities
        RetentionInDays: 30

    GetContactLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:custom.stage}-getContact
        RetentionInDays: 30

    CreateBookingLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:custom.stage}-createBooking
        RetentionInDays: 30

    AdminListBookingsLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:custom.stage}-adminListBookings
        RetentionInDays: 30

    AdminGetBookingLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:custom.stage}-adminGetBooking
        RetentionInDays: 30

    AdminUpdateBookingStatusLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:custom.stage}-adminUpdateBookingStatus
        RetentionInDays: 30

    # ── CloudWatch Alarms ────────────────────────────────────
    LambdaErrorAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-lambda-errors
        AlarmDescription: Lambda function error rate exceeded threshold
        MetricName: Errors
        Namespace: AWS/Lambda
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    LambdaThrottleAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-lambda-throttles
        AlarmDescription: Lambda throttles detected
        MetricName: Throttles
        Namespace: AWS/Lambda
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 10
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

  Outputs:
    UserPoolId:
      Description: Cognito User Pool ID
      Value: !Ref CognitoUserPool
      Export:
        Name: ${self:service}-${self:custom.stage}-UserPoolId

    UserPoolClientId:
      Description: Cognito App Client ID
      Value: !Ref CognitoUserPoolClient
      Export:
        Name: ${self:service}-${self:custom.stage}-UserPoolClientId

    ProfileImagesBucketName:
      Description: S3 bucket for profile images
      Value: !Ref ProfileImagesBucket

    CloudFrontDomain:
      Description: CloudFront distribution domain for serving profile images
      Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
      Export:
        Name: ${self:service}-${self:custom.stage}-CloudFrontDomain

    UsersTableName:
      Description: DynamoDB users table name
      Value: !Ref UsersTable

    BookingsTableName:
      Description: DynamoDB bookings table name
      Value: !Ref BookingsTable

    RoomsTableName:
      Description: DynamoDB rooms table name
      Value: !Ref RoomsTable

    GalleryTableName:
      Description: DynamoDB gallery table name
      Value: !Ref GalleryTable

    ReviewsTableName:
      Description: DynamoDB reviews table name
      Value: !Ref ReviewsTable

    ApiEndpoint:
      Description: HTTP API base URL
      Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
