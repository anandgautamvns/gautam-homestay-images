      - !Ref UtilitiesLambdaLayer
    events:
      - httpApi:
          path: /auth/login
          method: post

  confirmAccount:
    handler: src/handlers/auth.confirmAccount
    layers:
      - !Ref UtilitiesLambdaLayer
    events:
      - httpApi:
          path: /auth/confirm
