org: protiviti
app: profile
service: gautam-homestay-images

useDotenv: true

plugins:
  - serverless-offline

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    external:
      - '@aws-sdk/*'
      - /opt/nodejs/logger
    target: node22
    platform: node

custom:
  stage: ${opt:stage, 'dev'}

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${self:custom.stage}
  memorySize: 256
  timeout: 29
  logRetentionInDays: 30

  environment:
    STAGE: ${self:custom.stage}
    USERS_TABLE: !Ref UsersTable
    BOOKINGS_TABLE: !Ref BookingsTable
    ROOMS_TABLE: !Ref RoomsTable
    GALLERY_TABLE: !Ref GalleryTable
    REVIEWS_TABLE: !Ref ReviewsTable
    PROFILE_IMAGES_BUCKET: !Ref ProfileImagesBucket
    USER_POOL_ID: !Ref CognitoUserPool
    USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
    CLOUDFRONT_DOMAIN: !GetAtt CloudFrontDistribution.DomainName
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    # Booking notifications — set in .env (local) or CI/CD environment before deploying
    FROM_EMAIL:   ${env:FROM_EMAIL, 'anandgautamvns@gmail.com'}
    ADMIN_EMAIL:  ${env:ADMIN_EMAIL, 'anandgautamvns@gmail.com'}
    ADMIN_PHONE:  ${env:ADMIN_PHONE, '8542073022'}

  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}'
        audience:
          - !Ref CognitoUserPoolClient

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: !Sub '${ProfileImagesBucket.Arn}/*'
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt UsersTable.Arn
            - !Sub '${UsersTable.Arn}/index/*'
            - !GetAtt BookingsTable.Arn
            - !Sub '${BookingsTable.Arn}/index/*'
            - !GetAtt RoomsTable.Arn
            - !GetAtt GalleryTable.Arn
            - !GetAtt ReviewsTable.Arn
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'
        - Effect: Allow
          Action:
            - sns:Publish
          Resource: '*'
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminDeleteUser
            - cognito-idp:ListUsers
            - cognito-idp:ListUsersInGroup
            - cognito-idp:InitiateAuth
            - cognito-idp:SignUp
            - cognito-idp:ConfirmSignUp
            - cognito-idp:ForgotPassword
            - cognito-idp:ConfirmForgotPassword
          Resource: !GetAtt CognitoUserPool.Arn
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: 'arn:aws:logs:*:*:*'

layers:
  utilities:
    path: layers/utilities
    name: ${self:service}-${self:custom.stage}-utilities
    description: Shared CloudWatch structured logger and helpers
    compatibleRuntimes:
      - nodejs22.x
    retain: false

