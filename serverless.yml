  # ── Content (static) ─────────────────────────────────────
  listAmenities:
    handler: src/handlers/content.listAmenities
    layers:
      - !Ref UtilitiesLambdaLayer
    events:
      - httpApi:
          path: /amenities
          method: get

  getContact:
    handler: src/handlers/content.getContact
    layers:
      - !Ref UtilitiesLambdaLayer
    events:
      - httpApi:
          path: /contact
          method: get

  # ── Bookings ─────────────────────────────────────────────
  createBooking:
    handler: src/handlers/booking.createBooking
